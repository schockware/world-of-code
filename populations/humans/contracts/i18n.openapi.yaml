openapi: 3.1.0
info:
  title: Humans i18n Contract
  version: 0.1.0
  description: |
    Language and formatting, using the standards as written rather than inventing our own.

    - Language tags: BCP 47 (RFC 5646), see standards/i18n/rfc5646-bcp47.txt
    - Locale data and extension keys: Unicode CLDR / UTS #35 (the `-u-` extension)
    - Time zones: IANA tz database
    - Countries: ISO 3166-1 alpha-2, regions: ISO 3166-2
    - Currencies: ISO 4217
    - Scripts: ISO 15924

    Field names and values mirror the ECMAScript `Intl` API so a client can pass them straight through.
paths: {}
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: RFC 9110 section 12.5.4. Ordered, weighted language preferences.
      schema:
        type: string
        examples: ["fr-CH, fr;q=0.9, en;q=0.8, *;q=0.5"]
    TimeZone:
      name: X-Time-Zone
      in: header
      required: false
      description: IANA time zone name. No HTTP standard exists, so this header is ours.
      schema: { $ref: '#/components/schemas/TimeZone' }
  schemas:
    LanguageTag:
      type: string
      description: |
        BCP 47 language tag. Includes optional script, region, variants, and extensions,
        for example `en-US`, `zh-Hant-TW`, `de-CH-1996`, `ar-EG-u-nu-latn`.
      pattern: '^[A-Za-z]{2,3}(-[A-Za-z]{4})?(-([A-Za-z]{2}|[0-9]{3}))?(-([A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(-[A-WY-Za-wy-z0-9](-[A-Za-z0-9]{2,8})+)*(-x(-[A-Za-z0-9]{1,8})+)?$'
      examples: ["en-US", "zh-Hant-TW", "ar-EG-u-nu-latn"]
    TextDirection:
      type: string
      description: CSS `direction` and `writing-mode` families.
      enum: [ltr, rtl, ttb]
    Language:
      type: object
      description: The human's language preferences.
      required: [tag]
      properties:
        tag:
          $ref: '#/components/schemas/LanguageTag'
        fallbacks:
          type: array
          description: Ordered, most preferred first.
          items: { $ref: '#/components/schemas/LanguageTag' }
        direction:
          $ref: '#/components/schemas/TextDirection'
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2.
      pattern: '^[A-Z]{2}$'
      examples: ["FR"]
    CurrencyCode:
      type: string
      description: ISO 4217 alphabetic code.
      pattern: '^[A-Z]{3}$'
      examples: ["EUR"]
    TimeZone:
      type: string
      description: IANA time zone name, for example `Europe/Paris`. Not a UTC offset.
      examples: ["Europe/Paris", "America/Argentina/Buenos_Aires"]
    Calendar:
      type: string
      description: CLDR calendar identifier (`-u-ca-`).
      enum:
        [buddhist, chinese, coptic, dangi, ethioaa, ethiopic, gregory, hebrew, indian,
         islamic, islamic-civil, islamic-rgsa, islamic-tbla, islamic-umalqura, iso8601,
         japanese, persian, roc]
    NumberingSystem:
      type: string
      description: CLDR numbering system (`-u-nu-`), for example `latn`, `arab`, `deva`, `hanidec`.
      pattern: '^[a-z0-9]{3,8}$'
    HourCycle:
      type: string
      description: CLDR hour cycle (`-u-hc-`).
      enum: [h11, h12, h23, h24]
    Weekday:
      type: string
      description: First day of the week (`-u-fw-`).
      enum: [mon, tue, wed, thu, fri, sat, sun]
    MeasurementSystem:
      type: string
      description: CLDR measurement system (`-u-ms-`).
      enum: [metric, uksystem, ussystem]
    Collation:
      type: string
      description: CLDR collation type (`-u-co-`), for example `phonebk`, `pinyin`, `stroke`.
      pattern: '^[a-z0-9]{3,8}$'
    NameOrder:
      type: string
      description: Order in which personal names are displayed.
      enum: [given-first, family-first]
    Formatting:
      type: object
      description: |
        How values are presented. Every field is optional and, when absent, derived from
        the language tag via CLDR. Present fields override the derived value.
      properties:
        timeZone:          { $ref: '#/components/schemas/TimeZone' }
        calendar:          { $ref: '#/components/schemas/Calendar' }
        numberingSystem:   { $ref: '#/components/schemas/NumberingSystem' }
        hourCycle:         { $ref: '#/components/schemas/HourCycle' }
        firstDayOfWeek:    { $ref: '#/components/schemas/Weekday' }
        currency:          { $ref: '#/components/schemas/CurrencyCode' }
        measurementSystem: { $ref: '#/components/schemas/MeasurementSystem' }
        collation:         { $ref: '#/components/schemas/Collation' }
        nameOrder:         { $ref: '#/components/schemas/NameOrder' }
